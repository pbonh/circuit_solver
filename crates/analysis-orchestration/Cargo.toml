[package]
name = "analysis-orchestration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Analysis control loops and the Mixed-Signal Scheduler (tasks.md items #20–#22, #25–#28, #33–#35, #37–#41, #42–#51)."

[lints]
workspace = true

[dependencies]
circuit-solver-types = { path = "../circuit-solver-types" }
# AC analysis control loop (tasks.md #25) drives the AC sub-view
# extractor and the complex-valued sparse-LU dispatch from the
# numeric-solver crate. The control loop owns no MNA assembly logic
# of its own; it composes existing numeric-solver pieces. The noise
# control loop (tasks.md #37) shares this composition pattern.
numeric-solver = { path = "../numeric-solver" }
netlist-graph = { path = "../netlist-graph" }
# Noise analysis (tasks.md #37) consumes the intrinsic-noise stamp
# contract from device-modeling (tasks.md #36): the per-resistor
# `4kT/R` Johnson-Nyquist source is built via `resistor_thermal_noise`,
# and physical constants (`BOLTZMANN_J_PER_K`, `ROOM_TEMPERATURE_K`)
# are re-used to keep the thermal-noise formula in one canonical site.
device-modeling = { path = "../device-modeling" }
num-complex = { version = "0.4", default-features = false }

[dev-dependencies]
circuit-solver-types = { path = "../circuit-solver-types" }
numeric-solver = { path = "../numeric-solver" }
netlist-graph = { path = "../netlist-graph" }
# Third-party VCD reader used to prove the writer's output is
# parseable by standard VCD tooling, per the
# `mixed-signal-cosim#mixed-signal-result-contains-vcd-trace`
# Gherkin scenario (tasks.md item #50). Test-only — does not affect
# runtime dependency closure.
vcd = "0.7"
device-modeling = { path = "../device-modeling" }
# Scenario-level conformance witnesses (tasks.md #63–#68) consume the
# golden-reference parser + `max(rel, abs)` per-node comparator from
# the conformance-harness crate (tasks.md #62, ADR-0008). The AC
# conformance test (tasks.md #64) compares the ac_analysis driver's
# TransferFunction output against an ngspice ASCII rawfile golden using
# the ADR-0008 max(relative, absolute) envelope. The noise conformance
# test (tasks.md #66, scenario
# `noise-spectral-density#noise-conformance-against-ngspice`) is the
# first user of this dev-dep in this crate.
#
# Per-analysis conformance scenario tests (tasks.md #63–#67) load a
# committed ngspice ASCII rawfile via `conformance_harness::
# load_ngspice_ascii` and compare the orchestrated analysis result
# against it under ADR-0008's `max(rel, abs)` envelope. The harness
# is a dev-only dep — production analysis code does not depend on
# it.
conformance-harness = { path = "../conformance-harness" }
