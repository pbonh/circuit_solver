[package]
name = "application-frontend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Public Rust API surface (CircuitGraph, AnalysisRequest, AnalysisResult). Marked unstable per ADR-0010."

[lints]
workspace = true

[dependencies]
circuit-solver-types = { path = "../circuit-solver-types" }
# Per ADR-0001 the application frontend consumes the immutable CircuitGraph
# produced by netlist-graph and delegates analysis to the orchestration crate.
# Both deps are one-way (no reverse pin).
netlist-graph = { path = "../netlist-graph" }
analysis-orchestration = { path = "../analysis-orchestration" }
numeric-solver = { path = "../numeric-solver" }

[dev-dependencies]
# Compile-fail test infrastructure: verifies that undeclared cross-crate
# accesses are rejected by the compiler (ADR-0008).
trybuild = "1"

[[test]]
name = "compile_fail_undeclared_dep"
path = "tests/compile_fail_undeclared_dep.rs"
