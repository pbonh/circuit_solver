# development/config.yaml — scientia per-repo configuration.
#
# All keys are optional. Defaults shipped in the scientia bundle apply
# when a key is absent.

# Version pin. Bumped only by install.sh --upgrade migrations.
scientia_schema_version: 1
bundle_version_installed: 0.1.0

# Where the wiki lives.
wiki:
  path: wiki/
  raw_path: raw/

# Optional execution layer (scientia-hermes-*). Absent this block, the pipeline
# still ends at tasks.md and never touches Hermes. Present, the scientia
# orchestrator recommends scientia-hermes-init -> scientia-hermes-emit once tasks
# are complete. All keys are optional; the values below mirror the 0.2 bundle
# defaults — drop a key to inherit the bundle default for it.
hermes:
  board: ""                   # "" = the current project name (slugified project dir,
                              #      via scientia.hermes.board.resolve_board); else an explicit slug
  tenant_strategy: change-id  # change-id | none
  workspace: worktree         # scratch | worktree | dir:<absolute-path>
  pipeline: impl-review-integrate   # impl-review-integrate | single
  emit_epic: true
  on_supersede: archive       # archive | leave
  backend: rest               # rest | cli
  rest_base: http://127.0.0.1:8787/api/plugins/kanban   # loopback dashboard plugin
  conflict_prevention: true   # C4-derived waves + shared-contract ratification
  max_parallel_per_file_group: 2   # wave cap on tasks sharing a touched path
  preflight:
    require_gateway: true
    require_profiles: true
  # Default model config — used by any profile that doesn't override it below.
  # Fireworks (https://app.fireworks.ai/models) is the default provider because
  # it offers fast, OpenAI-compatible inference for leading open-weight models.
  # Override per-profile or switch the default to any supported vendor.
  models:
    default:
      provider: fireworks
      model: accounts/fireworks/models/deepseek-v4-flash
      base_url: https://api.fireworks.ai/inference/v1
      api_key_env: FIREWORKS_API_KEY
      temperature: 0.2
      max_tokens: 131072
  profiles:                   # provisioned/validated by scientia-hermes-init
    implementer:
      description: "Writes code + tests for one task in an isolated worktree."
      model:
        provider: fireworks
        model: accounts/fireworks/models/glm-5p1
        base_url: https://api.fireworks.ai/inference/v1
        api_key_env: FIREWORKS_API_KEY
        temperature: 0.1
        max_tokens: 25344
    reviewer:
      description: "Reviews a completed task branch against its spec scenario."
      model:
        provider: fireworks
        model: accounts/fireworks/models/kimi-k2p6
        base_url: https://api.fireworks.ai/inference/v1
        api_key_env: FIREWORKS_API_KEY
        temperature: 0.3
        max_tokens: 32768
    integrator:
      description: "Merges an approved branch to trunk; routes conflicts to conflict-resolver."
      model:
        provider: fireworks
        model: accounts/fireworks/models/minimax-m2p7
        base_url: https://api.fireworks.ai/inference/v1
        api_key_env: FIREWORKS_API_KEY
        temperature: 0.0
        max_tokens: 24576
    conflict-resolver:
      description: "Reconciles merge/semantic conflicts using spec scenarios, ratified contracts, and C4 boundaries; resolves without human input where safe, escalates only genuine spec contradictions."
      model:
        provider: fireworks
        model: accounts/fireworks/models/deepseek-v4-pro
        base_url: https://api.fireworks.ai/inference/v1
        api_key_env: FIREWORKS_API_KEY
        temperature: 0.0
        max_tokens: 131072

# Emit policy.
emit:
  # ADR-status -> collaboration pattern. The wiki documents these defaults.
  default_pattern_by_adr_status:
    accepted:    P2-pipeline
    proposed:    P5-human-in-loop
    deprecated:  refuse
    superseded:  refuse
  # Tenants in this list always emit with --require-approval, regardless of ADR status.
  require_approval_tenants: []

# Verify strictness. block_on_severity is the threshold for verify_all.py
# (and the orchestrator) to refuse to advance.
verify:
  block_on_severity: critical    # critical | warning | suggestion

# Ingest policy.
ingest:
  # When true, scientia-ingest-synthesize writes only proposed edits to
  # wiki/syntheses/; direct writes to wiki/concepts/ and wiki/entities/
  # are not allowed.
  synthesize_proposes_only: true

# Per-tenant overrides. Tenant name = bounded-context slug.
tenants: {}
#   billing:
#     require_approval: true
