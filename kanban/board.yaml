# Hermes Kanban binding for this wiki. Edited by /wiki-kanban-board;
# read by /wiki-kanban-emit, /wiki-kanban-ingest, and /wiki-lint.
#
# CUSTOMIZE via `/wiki-kanban-board <slug>`. Do not hand-edit this file
# unless you know what you are doing — the slash command validates
# everything against `hermes kanban` before writing.

board: circuit-solver
workspace_default: dir:./project
project_root: ./project

profiles:
  orchestrator: default
  worker: default
  reviewer: default

# Optional: collaboration-pattern → profile-set overrides. If absent,
# /wiki-kanban-emit picks from ADR status using the defaults above.
patterns: {}
