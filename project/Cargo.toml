[package]
name = "circuit-solver"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust analog/digital/mixed-signal circuit simulator"

[dependencies]
circuit-solver-types = { path = "../crates/circuit-solver-types" }
numeric-solver = { path = "../crates/numeric-solver" }
device-modeling = { path = "../crates/device-modeling" }
analysis-orchestration = { path = "../crates/analysis-orchestration" }
netlist-graph = { path = "../crates/netlist-graph" }
tempfile = "3"

[dev-dependencies]
trybuild = "1"

[[test]]
name = "digital-equivalence"
path = "tests/digital/equivalence.rs"

[[test]]
name = "digital-vcd"
path = "tests/digital/vcd.rs"

[[test]]
name = "digital-golden-icarus"
path = "tests/digital/golden_icarus.rs"

[[test]]
name = "no-runtime-registration"
path = "tests/devices/no_runtime_registration.rs"