[package]
name = "circuit-solver"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust analog/digital/mixed-signal circuit simulator"

[dependencies]
circuit-solver-types = { path = "../crates/circuit-solver-types" }
numeric-solver = { path = "../crates/numeric-solver" }
